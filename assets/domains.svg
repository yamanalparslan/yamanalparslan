    <clipPath id="clip-c1"><rect x="4" y="4" width="584" height="156" rx="14"/></clipPath>
    <clipPath id="clip-c2"><rect x="612" y="4" width="584" height="156" rx="14"/></clipPath>
    <clipPath id="clip-c3"><rect x="4" y="180" width="584" height="156" rx="14"/></clipPath>
    <clipPath id="clip-c4"><rect x="612" y="180" width="584" height="156" rx="14"/></clipPath>
