    <rect x="612.75" y="180.75" width="582.5" height="154.5" rx="14" fill="none" stroke="#1e293b" stroke-width="1.2"/>

    <rect x="634" y="200" width="32" height="32" rx="8" fill="#818cf8" fill-opacity="0.14" stroke="#818cf8" stroke-opacity="0.4"/>
