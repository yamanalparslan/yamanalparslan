      <text x="856" y="313" text-anchor="middle">C# / .NET</text>

      <rect x="906" y="298" width="124" height="22" rx="6" fill="#818cf8" fill-opacity="0.1" stroke="#818cf8" stroke-opacity="0.35"/>
