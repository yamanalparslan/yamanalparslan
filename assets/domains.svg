    </text>

    <text x="634" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8">
      <tspan x="634" dy="0">Bare-metal &amp; RTOS C/C++ on STM32G474 &amp; ESP32-S3, high-res PWM timers,</tspan>
      <tspan x="634" dy="20">ADC/DAC control loops, hardware protection, probe-rs &amp; KiCad PCB design.</tspan>
    </text>

    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#7dd3fc">
      <rect x="634" y="122" width="84" height="22" rx="6" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="676" y="137" text-anchor="middle">STM32G474</text>

