      <tspan x="26" dy="20">PostgreSQL time-series storage, real-time operational dashboards.</tspan>
    </text>

    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#6ee7b7">
      <rect x="26" y="298" width="114" height="22" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.35"/>
      <text x="83" y="313" text-anchor="middle">Modbus RTU/TCP</text>

      <rect x="148" y="298" width="76" height="22" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.35"/>
      <text x="186" y="313" text-anchor="middle">RS-485</text>

      <rect x="232" y="298" width="96" height="22" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.35"/>
      <text x="280" y="313" text-anchor="middle">PostgreSQL</text>

      <rect x="336" y="298" width="110" height="22" rx="6" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.35"/>
