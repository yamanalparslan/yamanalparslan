    <radialGradient id="glow-violet" cx="12%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
