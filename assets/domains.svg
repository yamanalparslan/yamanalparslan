      <rect x="814" y="122" width="96" height="22" rx="6" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="862" y="137" text-anchor="middle">PWM / ADC</text>

      <rect x="918" y="122" width="128" height="22" rx="6" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="982" y="137" text-anchor="middle">probe-rs / KiCad</text>
    </g>
  </g>

  <!-- CARD 3: Industrial SCADA & Solar Telemetry (Emerald #10b981) -->
  <g clip-path="url(#clip-c3)">
    <rect x="4" y="180" width="584" height="156" rx="14" fill="url(#card-bg)"/>
    <rect x="4" y="180" width="584" height="156" rx="14" fill="url(#glow-emerald)"/>
    <rect x="4" y="180" width="584" height="3.5" fill="#10b981"/>
