  <!-- CARD 1: Power Electronics & Energy Conversion (Amber/Orange #f59e0b) -->
  <g clip-path="url(#clip-c1)">
    <rect x="4" y="4" width="584" height="156" rx="14" fill="url(#card-bg)"/>
    <rect x="4" y="4" width="584" height="156" rx="14" fill="url(#glow-amber)"/>
    <rect x="4" y="4" width="584" height="3.5" fill="#f59e0b"/>
    <rect x="4" y="4" width="4" height="156" fill="#f59e0b"/>
    <rect x="4.75" y="4.75" width="582.5" height="154.5" rx="14" fill="none" stroke="#1e293b" stroke-width="1.2"/>

    <rect x="26" y="24" width="32" height="32" rx="8" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.4"/>
    <text x="42" y="45" text-anchor="middle" font-size="16">⚡</text>
    <text x="70" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="700" fill="#f8fafc">
      Power Electronics &amp; Energy Conversion
    </text>

    <text x="26" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#94a3b8">
      <tspan x="26" dy="0">Dual Active Bridge (DAB) DC–DC converters, UPS architectures, CC/CV</tspan>
      <tspan x="26" dy="20">battery management, magnetics, SPICE &amp; Python harmonic/FFT modeling.</tspan>
    </text>

    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#fbbf24">
      <rect x="26" y="122" width="84" height="22" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.35"/>
      <text x="68" y="137" text-anchor="middle">DAB DC-DC</text>

      <rect x="118" y="122" width="110" height="22" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.35"/>
      <text x="173" y="137" text-anchor="middle">UPS &amp; CC/CV</text>

      <rect x="236" y="122" width="90" height="22" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.35"/>
      <text x="281" y="137" text-anchor="middle">Magnetics</text>

      <rect x="334" y="122" width="114" height="22" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.35"/>
      <text x="391" y="137" text-anchor="middle">SPICE / FFT</text>
